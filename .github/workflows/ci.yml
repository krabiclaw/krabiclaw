name: CI

on:
  pull_request:
    branches: [main, staging, "epoch/**"]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Checks
    if: >-
      github.event_name == 'push'
      || !(github.base_ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Hardened immutable installs
        env:
          YARN_ENABLE_HARDENED_MODE: "1"
        run: corepack yarn install --immutable
      - run: yarn quality
      - run: yarn test:unit
      - run: yarn test:d1
      - run: yarn mcp:catalog
      - run: yarn chatgpt:submission:check
      - run: yarn lint:migrations
      - run: yarn lint:schema-drift
      - run: yarn test:migrations

  e2e:
    name: E2E
    if: >-
      github.event_name == 'pull_request'
      && !(github.base_ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      PLATFORM_OWNER_EMAILS: ${{ secrets.PLATFORM_OWNER_EMAILS }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_E2E }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_E2E }}
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      # The onboarding draft endpoints sign their preview tokens with it and
      # answer 503 without it, so the wizard never got past its first save.
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET_PREVIEW }}
      # Default E2E exercises manual onboarding; live Places qualification is opt-in.
      GOOGLE_PLACES_API_KEY: ""
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANARY_LOGIN_EMAIL: ${{ secrets.CANARY_LOGIN_EMAIL }}
      CANARY_LOGIN_PASSWORD: ${{ secrets.CANARY_LOGIN_PASSWORD }}
      CANARY_ORG_ID: ${{ secrets.CANARY_ORG_ID }}
      # CIMD client metadata must be public HTTPS, which localhost cannot serve.
      # Staging's test-client documents are the ones docs/testing-strategy.md names.
      MCP_CIMD_CLIENT_URL: https://staging.krabiclaw.com/api/auth/oauth2/test-client-metadata
      MCP_PRIVATE_CIMD_CLIENT_URL: https://staging.krabiclaw.com/api/auth/oauth2/test-private-client-metadata
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: &install_browsers |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          corepack yarn playwright install --with-deps chromium webkit
      # playwright.config.ts runs e2e:local:prepare itself when the worker is not
      # already prepared: local schema verification and the production build. The explicit
      # local:setup step copies the shared review credential once.
      - run: yarn local:setup
      - run: yarn test:e2e
      # Wrangler's own log names why the local Worker stopped serving; run
      # 36298734414 died serving _nuxt chunks with nothing else to read.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-pr
          path: |
            playwright-report/
            test-results/
            ~/.config/.wrangler/logs/
          retention-days: 14
          if-no-files-found: ignore

  e2e-staging:
    name: Deploy and test staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    # Staging is the first deployed validation. Checks gates this exact SHA.
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://staging.krabiclaw.com
      NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw Staging
      NUXT_PUBLIC_SITE_URL: https://staging.krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://staging.krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://staging.krabiclaw.com
      MCP_BASE_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://staging.krabiclaw.com
      PLAYWRIGHT_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: *install_browsers
      - name: Build staging Worker
        run: yarn build
      - name: Capture Nuxt build ID
        id: nuxt_build
        run: |
          build_id="$(node -p 'JSON.parse(require("node:fs").readFileSync(".output/public/_nuxt/builds/latest.json", "utf8")).id')"
          printf 'id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"
      # Migrations run before the deploy. A migration is backward compatible with the
      # Worker already running -- contractions ship a release after the code that
      # stopped reading the column -- so the old Worker keeps serving against the new
      # schema, and the new Worker never meets a schema it predates. Deploying first
      # leaves a window of new code against old schema, and a failed migration would
      # leave that code live.
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler d1 migrations apply DB --env staging --remote
      # `d1 migrations apply` skips a tag already in `d1_migrations`, so a
      # regenerated baseline leaves the database on whatever it first carried
      # and the deploy says nothing. This is where that stops being silent.
      - name: Verify the staging database carries this baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn lint:schema-drift --env staging
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --env staging --strict
      - name: Run read-only tenant MCP discovery smoke
        run: yarn test:mcp
      # A Worker version reaches colos gradually. Until every colo serves the new
      # version, one colo renders the page while another serves the assets, and the
      # old build's chunks 404. Production already waits for this; staging did not,
      # and its first run after a deploy failed on exactly that.
      - name: Wait for staging assets to converge
        env:
          EXPECTED_NUXT_BUILD_ID: ${{ steps.nuxt_build.outputs.id }}
        run: >-
          node scripts/wait-for-nuxt-deployment.mjs
          https://pottery-house-staging.krabiclaw.com
          https://kikuzuki-krabi-thailand-staging.krabiclaw.com
          https://ncls-staging.krabiclaw.com
          https://staging.krabiclaw.com
      - name: Verify published MCP documentation
        run: yarn mcp:catalog --check-live-docs --base-url https://staging.krabiclaw.com
      - name: Run read-only tenant rendering
        run: yarn test:e2e:tenant-rendering
      - name: Upload staging Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-staging
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    outputs:
      nuxt_build_id: ${{ steps.nuxt_build.outputs.id }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://krabiclaw.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - name: Build production Worker
        run: yarn build
      - name: Capture Nuxt build ID
        id: nuxt_build
        run: |
          build_id="$(node -p 'JSON.parse(require("node:fs").readFileSync(".output/public/_nuxt/builds/latest.json", "utf8")).id')"
          printf 'id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"
      # Migrations before the deploy, for the reason given in the staging job.
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler d1 migrations apply DB --remote
      - name: Verify the production database carries this baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn lint:schema-drift --production
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: corepack yarn wrangler deploy --strict
  verify-production:
    name: Verify production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NUXT_PUBLIC_PLATFORM_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN: https://krabiclaw.com
      NUXT_PUBLIC_APP_NAME: KrabiClaw
      NUXT_PUBLIC_SITE_URL: https://krabiclaw.com
      NUXT_PUBLIC_HELP_URL: https://krabiclaw.com/help
      NUXT_PUBLIC_WHATSAPP_NUMBER: "16197200000"
      BETTER_AUTH_URL: https://krabiclaw.com
      PLAYWRIGHT_PREVIEW_URL: https://krabiclaw.com
      PLAYWRIGHT_WORKERS: "1"
      EXPECTED_NUXT_BUILD_ID: ${{ needs.deploy-production.outputs.nuxt_build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - run: corepack enable
      - name: Restore Yarn package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: corepack yarn install --immutable
      - run: *install_browsers
      - name: Wait for production assets to converge
        run: >-
          node scripts/wait-for-nuxt-deployment.mjs
          https://www.potteryhousekrabi.com
          https://www.kikuzuki-thailand.com
          https://www.northcarolinalegalservices.org
          https://krabiclaw.com
      - name: Verify published MCP documentation
        run: yarn mcp:catalog --check-live-docs --base-url https://krabiclaw.com
      - name: Refresh production search index
        env:
          PLATFORM_SEARCH_REINDEX_SECRET: ${{ secrets.PLATFORM_SEARCH_REINDEX_SECRET }}
          SEARCH_BASE_SHA: ${{ github.event.before }}
          SEARCH_HEAD_SHA: ${{ github.sha }}
        run: yarn ai-search:sync:prod --changed-since "$SEARCH_BASE_SHA" --changed-until "$SEARCH_HEAD_SHA"
      - name: Run read-only production tenant rendering
        run: yarn test:e2e:tenant-rendering
      - name: Upload production Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
