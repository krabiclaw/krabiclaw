name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact production commit approved for publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.sha == inputs.reviewed_sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check the live issuer and resource
        run: |
          set -euo pipefail
          curl -fsS https://blawby.com/.well-known/oauth-authorization-server |
            jq -e '.issuer == "https://blawby.com"'
          curl -fsS https://blawby.com/.well-known/oauth-protected-resource |
            jq -e '.resource == "https://blawby.com/api/mcp"'
      - name: Publish reviewed descriptor
        run: |
          set -euo pipefail
          release=https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1
          archive=mcp-publisher_linux_amd64.tar.gz
          cd "${RUNNER_TEMP}"
          curl -fsSLO "$release/$archive"
          curl -fsSLO "$release/registry_1.8.1_checksums.txt"
          grep " $archive\$" registry_1.8.1_checksums.txt | sha256sum -c -
          printf '%s  %s\n' a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc "$archive" | sha256sum -c -
          tar -xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish "${GITHUB_WORKSPACE}/server.json"
