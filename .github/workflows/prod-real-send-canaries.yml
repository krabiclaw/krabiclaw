name: Blawby Pages edge preflight

on: workflow_dispatch

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the Blawby home page with curl
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 --dump-header "$RUNNER_TEMP/blawby-home.headers" --output "$RUNNER_TEMP/blawby-home.html" --write-out '%{http_code}' https://blawby.com/)
          echo "curl / status=$status"
          awk 'BEGIN { IGNORECASE=1 } /^(content-type|cf-ray|cf-mitigated):/ { print }' "$RUNNER_TEMP/blawby-home.headers"
          [[ "$status" == 200 ]]
          rg -qi '^content-type: text/html' "$RUNNER_TEMP/blawby-home.headers"
          rg -qi '^cf-ray: ' "$RUNNER_TEMP/blawby-home.headers"
          if rg -qi '^cf-mitigated:|cdn-cgi/challenge-platform' "$RUNNER_TEMP/blawby-home.headers" || rg -qi '<title>Just a moment' "$RUNNER_TEMP/blawby-home.html"; then
            echo 'Cloudflare challenged the home page'
            exit 1
          fi
      - name: Replay the Node build lookup against the Pages origin
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const url = new URL('/_nuxt/builds/latest.json', 'https://blawby.com')
          url.searchParams.set('deployment-check', Date.now() + '-' + crypto.randomUUID())
          const response = await fetch(url, { redirect: 'manual', signal: AbortSignal.timeout(30_000) })
          const headers = Object.fromEntries(['cf-ray', 'cf-mitigated', 'content-type'].map(name => [name, response.headers.get(name)]))
          console.log(JSON.stringify({ path: url.pathname, status: response.status, ...headers }))
          assert.equal(headers['cf-mitigated'], null)
          assert.ok(headers['cf-ray'])
          assert.equal(response.status, 404)
          assert.doesNotMatch(await response.text(), /<title>Just a moment/i)
          NODE
