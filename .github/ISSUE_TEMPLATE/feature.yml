name: Feature request
description: Something KrabiClaw should be able to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Leave out guest names, contact details and payment details.

        Assistants filing for a user: these fields can be prefilled by query parameter using the field ids below (for example `&need=...`).
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task, in the words you would use with your assistant or staff.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you handle it today
  - type: input
    id: site
    attributes:
      label: Website or business
      placeholder: https://example.krabiclaw.com
