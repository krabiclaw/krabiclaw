# The Durable Object Worker `nuxt dev` starts beside the platform proxy. See
# guest-inbox-hub.worker.ts. Never deployed: `wrangler deploy` reads the root
# wrangler.toml, where the class belongs to the main Worker.
name = "blawby-guest-inbox-hub"
main = "guest-inbox-hub.worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat_v2", "web_socket_auto_reply_to_close"]

[define]
"import.meta.dev" = "true"

[[durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"

[[queues.producers]]
binding = "EVENTS"
queue = "krabiclaw-events-local"

[[queues.consumers]]
queue = "krabiclaw-events-local"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5

# Airbnb sync and disconnect steps (server/integrations/channex/airbnb-sync.ts): one delivery at a time,
# so a repeated delivery reads the stage the earlier one saved and never sends the same Channex create twice.
[[queues.producers]]
binding = "AIRBNB_SYNC"
queue = "blawby-airbnb-sync-local"

[[queues.consumers]]
queue = "blawby-airbnb-sync-local"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
max_concurrency = 1

[[migrations]]
tag = "v1_guest_inbox_hub"
new_sqlite_classes = ["GuestInboxHubObject"]
