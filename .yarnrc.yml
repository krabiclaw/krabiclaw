nodeLinker: node-modules
npmRegistryServer: "https://registry.npmjs.org"
npmMinimalAgeGate: "30d"
npmPreapprovedPackages:
  - postal-mime
  # Wrangler 4.153.0 is the first release whose exact-pinned miniflare
  # (5.20261023.0-beta) ships undici 7.30.1 and sharp 0.35.5, fixing the undici
  # content-length, cross-origin cache, TLS and renegotiation advisories and
  # sharp's librsvg CVE-2026-96889. Its workerd, platform binaries, unenv preset
  # and workers-types peer move with it.
  - "wrangler@4.153.0"
  - "@cloudflare/workers-types@5.20261023.1"
  - "@cloudflare/unenv-preset@2.16.2"
  - "miniflare@5.20261023.0-beta"
  - "workerd@1.20261023.1"
  - "@cloudflare/workerd-linux-64@1.20261023.1"
  - "@cloudflare/workerd-linux-arm64@1.20261023.1"
  - "@cloudflare/workerd-darwin-64@1.20261023.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261023.1"
  - "@cloudflare/workerd-windows-64@1.20261023.1"
  # brace-expansion 2.1.7 and 5.0.12 fix GHSA-6j4f-fj2g-mc7p and
  # GHSA-qhr7-859c-m2p7 (stack exhaustion), reached through minimatch 9 and 10.
  - "brace-expansion@2.1.7"
  - "brace-expansion@5.0.12"
  # devalue 5.9.4 fixes GHSA-j22f-vq7h-c4qm, GHSA-mcm9-63f2-9j32 and
  # GHSA-x5rw-q4pp-hg5g within nuxt-nightly's ^5.9.0 range.
  - "devalue@5.9.4"
  # Better Auth 1.7.5 preserves the Claude CIMD grant-types fix and allows
  # consecutive OAuth requests with valid uncached client metadata. Its five
  # packages version in lockstep; fetch 1.3.3 is their exact shared dependency at 1.7.15.
  - better-auth
  - "@better-auth/core"
  - "@better-auth/cimd"
  - "@better-auth/oauth-provider"
  - "@better-auth/stripe"
  - "@better-auth/drizzle-adapter"
  - "@better-auth/kysely-adapter"
  - "@better-auth/memory-adapter"
  - "@better-auth/mongo-adapter"
  - "@better-auth/prisma-adapter"
  - "@better-auth/telemetry"
  - "@better-auth/utils"
  - "@better-fetch/fetch@1.3.3"
  - "better-call@1.4.4"
  - zod
  # The weekly audit's high and critical advisories, each at the earliest fixing release:
  # Better Auth 1.7.15 (preapproved above) fixes GHSA OAuth-state magic-link and
  # OAuth-proxy sign-in as another user; MCP SDK 2.3.0 fixes the shared transport,
  # request-size exhaustion and authorization-server credential leaks; vue-i18n
  # 11.4.14 escapes srcdoc parameters; DOMPurify 3.4.17 closes SAFE_FOR_TEMPLATES and
  # IN_PLACE bypasses; prosemirror-view 1.42.3 the paste XSS; seroval 1.6.8 its
  # deserialization advisories; shell-quote 1.11.0 command injection; source-map-js
  # 1.2.2, undici 6.29.1/7.30.1/8.12.2, sharp 0.35.5, zod 4.6.6, vite 8.3.3 and
  # launch-editor 2.14.2 their denial-of-service and Windows path advisories.
  - "@modelcontextprotocol/client@2.3.0"
  - "@modelcontextprotocol/server@2.3.0"
  - "@modelcontextprotocol/core@2.3.0"
  - "vue-i18n@11.4.14"
  - "@intlify/core-base@11.4.14"
  - "@intlify/shared@11.4.14"
  - "@intlify/message-compiler@11.4.14"
  - "@intlify/devtools-types@11.4.14"
  - "dompurify@3.4.17"
  - "prosemirror-view@1.42.3"
  - "seroval@1.6.8"
  - "seroval-plugins@1.6.8"
  - "shell-quote@1.11.0"
  - "source-map-js@1.2.2"
  - "undici@6.29.1"
  - "undici@7.30.1"
  - "undici@8.12.2"
  - "sharp@0.35.5"
  - "vite@8.3.3"
  - "launch-editor@2.14.2"
  # Lighthouse's puppeteer-core 25.13.0 is the first on chromium-bidi 157, which moves
  # it off zod 3 (no zod 3 release fixes the oversized-collection advisory).
  - "puppeteer-core@25.13.0"
  - "chromium-bidi@157.0.8090-0"
  - "@puppeteer/browsers@3.2.4"
  - "devtools-protocol@0.0.1696802"
  - "webdriver-bidi-protocol@1.0.1"
enableScripts: false
checksumBehavior: throw
