NUXT_PUBLIC_VAPID_PUBLIC_KEY = "BK_xrjKKq-juVkp961DdsBtXYnf38NvPsSHUN0gESru1OCtvWjXukSFzDZTY2qDIV4RtDpl4_qvoNfcc0fwaMTo"
CF_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
BETTER_AUTH_URL = "https://staging.blawby.com"
NUXT_PUBLIC_PLATFORM_DOMAIN = "https://staging.blawby.com"
MEDIA_BASE_URL = "https://staging.blawby.com/__media"
NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN = "https://blawby.com"
NUXT_PUBLIC_APP_NAME = "Blawby"
NUXT_PUBLIC_SITE_URL = "https://staging.blawby.com"
