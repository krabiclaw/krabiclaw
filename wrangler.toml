name = "krabiclaw"
main = ".output/server/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat_v2", "nodejs_compat_populate_process_env", "global_fetch_strictly_public"]

# D1 lives in WNAM and every statement is a round trip to it. Smart placement
# never moved execution (every request reported cf-placement local-*), so a
# visitor paid 8-27 trans-continental hops per page. Run next to the database.
[placement]
mode = "targeted"
region = "aws:us-west-2"

[assets]
directory = ".output/public"

[dev]
host = "localhost:3000"
port = 3000
local_protocol = "http"
upstream_protocol = "http"

[triggers]
# Every expression is dispatched through Nitro's cloudflare:scheduled hook.
# Keep this list in sync with SCHEDULED_TASKS in server/scheduled-tasks.ts.
crons = ["*/5 * * * *", "*/2 * * * *", "*/10 * * * *", "0 3 * * *", "0 4 * * *", "0 0 * * SUN", "0 * * * *"]

[[routes]]
pattern = "*.krabiclaw.com/*"
zone_name = "krabiclaw.com"

[[routes]]
pattern = "krabiclaw.com/*"
zone_name = "krabiclaw.com"

[[routes]]
pattern = "*/*"
zone_name = "krabiclaw.com"



[vars]
CF_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
BETTER_AUTH_URL = "https://krabiclaw.com"
NUXT_PUBLIC_PLATFORM_DOMAIN = "https://krabiclaw.com"
NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN = "https://krabiclaw.com"
NUXT_PUBLIC_APP_NAME = "Krabiclaw"
NUXT_PUBLIC_SITE_URL = "https://krabiclaw.com"
NUXT_PUBLIC_HELP_URL = "https://krabiclaw.com/help"
NUXT_PUBLIC_WHATSAPP_NUMBER = "16197200000"
MEDIA_BASE_URL = "https://media.krabiclaw.com"
AI_SEARCH_NAMESPACE = "default"
AI_SEARCH_INSTANCE_ID = "krabiclaw-platform-knowledge"
# Production is the only environment that should send real email/WhatsApp — made explicit
# here rather than relying on getEmailDeliveryMode/getWhatsAppDeliveryMode's default, since
# that default now fails closed (log_only) precisely so a missing var elsewhere never sends real messages.
EMAIL_DELIVERY_MODE = "provider"
WHATSAPP_DELIVERY_MODE = "provider"
# Startup workflow debugging: detailed MCP inputs/results expire after seven days.
MCP_DIAGNOSTICS_ENABLED = "true"
# Internal cron/API endpoints use CRON_SECRET:
#   yarn wrangler secret put CRON_SECRET
# GA4_API_SECRET (Measurement Protocol) is a secret, not a var. It belongs to the
# GA4 property connected to the platform organization's own Google Analytics
# integration; there is no environment-level measurement ID:
#   yarn wrangler secret put GA4_API_SECRET
# PREVIEW_SECRET signs scoped preview/draft tokens (server/utils/preview-token.ts)
# and is required by the onboarding draft endpoints. It must stay stable across
# deploys/runs in a given environment — rotating it invalidates any draft preview
# tokens currently in flight. Staging and production set it once as a Worker
# secret; CI's E2E job gives its local Worker the PREVIEW_SECRET_PREVIEW repo
# secret (see .github/workflows/ci.yml):
#   yarn wrangler secret put PREVIEW_SECRET
# EMAIL_REPLY_SECRET signs reply+<type>-<id>-<token>@reply.<platform-domain> addresses
# (server/utils/submission-messages.ts) so a customer's inbound reply can be matched back to the
# right reservation/contact/experience-booking thread without a DB lookup by address alone.
# It must stay stable across deploys because rotating it invalidates reply-to addresses already
# sent out in guest emails. Staging syncs it from the fixed EMAIL_REPLY_SECRET_STAGING repo
# secret on every run (see .github/workflows/ci.yml); production is set once manually and not
# touched by CI:
#   yarn wrangler secret put EMAIL_REPLY_SECRET
# PLATFORM_SEARCH_REINDEX_SECRET protects POST /api/internal/search/reindex and is required for
# yarn ai-search:sync. Production CI syncs it from the PLATFORM_SEARCH_REINDEX_SECRET repo
# secret and rebuilds the production index. Non-production has no AI Search binding
# automatically (see .github/workflows/ci.yml and docs/ai-search.md). To set it by hand:
#   yarn wrangler secret put PLATFORM_SEARCH_REINDEX_SECRET

[[d1_databases]]
binding = "DB"
database_name = "krabiclaw-production-v16"
database_id = "754caf79-1e59-4e5e-93d7-18449df90e3b"
migrations_dir = "migrations"
remote = false

[[durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"

[[migrations]]
tag = "v1_guest_inbox_infra"
new_sqlite_classes = ["GuestThreadCommandObject", "GuestInboxHubObject"]

[[migrations]]
tag = "v2_delete_guest_thread_command"
deleted_classes = ["GuestThreadCommandObject"]

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "krabiclaw-media"
remote = false

[[kv_namespaces]]
binding = "ORGANIZATION_CACHE"
id = "7fadf142e35745d6bec16b260eaab2f2"
remote = false

[ai]
binding = "AI"
remote = true

[images]
binding = "IMAGES"

[[ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"
remote = true

[observability]
enabled = true

[observability.traces]
enabled = true

# Stable staging environment — uses dedicated non-production data/resources.
# Tenant aliases stay at the first subdomain level (for example,
# pottery-house-staging.krabiclaw.com), which is covered by the zone certificate.
# The more-specific environment route wins over production's broad wildcard.
# `nuxt dev` only. Wrangler's platform proxy runs an empty script, so a Durable
# Object bound to a class in this Worker never resolves there; the class is
# served by server/cloudflare/dev/wrangler.toml (started by
# server/plugins/00.cloudflare-dev-bindings.ts) and bound by script_name.
# Bindings are not inherited by an environment, so the rest mirrors the
# top-level Worker against the same local resources. Never deployed.
[env.dev]

[env.dev.vars]
CF_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
BETTER_AUTH_URL = "https://krabiclaw.com"
NUXT_PUBLIC_PLATFORM_DOMAIN = "https://krabiclaw.com"
NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN = "https://krabiclaw.com"
NUXT_PUBLIC_APP_NAME = "Krabiclaw"
NUXT_PUBLIC_SITE_URL = "https://krabiclaw.com"
NUXT_PUBLIC_HELP_URL = "https://krabiclaw.com/help"
NUXT_PUBLIC_WHATSAPP_NUMBER = "16197200000"
MEDIA_BASE_URL = "https://media.krabiclaw.com"
EMAIL_DELIVERY_MODE = "provider"
WHATSAPP_DELIVERY_MODE = "provider"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "krabiclaw-production-v16"
database_id = "754caf79-1e59-4e5e-93d7-18449df90e3b"
migrations_dir = "migrations"
remote = false

[[env.dev.durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"
script_name = "krabiclaw-guest-inbox-hub"

[[env.dev.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "krabiclaw-media"
remote = false

[[env.dev.kv_namespaces]]
binding = "ORGANIZATION_CACHE"
id = "7fadf142e35745d6bec16b260eaab2f2"
remote = false

[env.dev.ai]
binding = "AI"
remote = true

[env.dev.images]
binding = "IMAGES"

[env.staging]
routes = [
  { pattern = "staging.krabiclaw.com/*", zone_name = "krabiclaw.com" },
  { pattern = "*-staging.krabiclaw.com/*", zone_name = "krabiclaw.com" }
]

# Top-level [triggers] crons are inherited by named environments unless
# overridden. Scheduled tasks never run against staging's copy of production
# data: scanning a growing, never-cleaned non-production database every few
# minutes once drove a 93B-row D1 billing spike.
[env.staging.triggers]
crons = []

[env.staging.vars]
CF_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
BETTER_AUTH_URL = "https://staging.krabiclaw.com"
NUXT_PUBLIC_PLATFORM_DOMAIN = "https://staging.krabiclaw.com"
MEDIA_BASE_URL = "https://staging.krabiclaw.com/__media"
NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN = "https://krabiclaw.com"
NUXT_PUBLIC_APP_NAME = "Krabiclaw Staging"
NUXT_PUBLIC_SITE_URL = "https://staging.krabiclaw.com"
NUXT_PUBLIC_HELP_URL = "https://staging.krabiclaw.com/help"
NUXT_PUBLIC_WHATSAPP_NUMBER = "16197200000"
# Staging runs on a copy of production's rows and has no Zaraz zone of its own;
# reconciling would rewrite production's tags. Production leaves this unset.
ZARAZ_ANALYTICS = "absent"
EMAIL_DELIVERY_MODE = "log_only"
WHATSAPP_DELIVERY_MODE = "log_only"
E2E_ALLOW_DEV_ROUTES = "true"
# E2E_DEV_ROUTE_SECRET is pushed via `wrangler secret put` in ci.yml, not a plaintext var here.

[[env.staging.d1_databases]]
binding = "DB"
database_name = "krabiclaw-staging-v16"
database_id = "76622a9c-bb92-4c1d-ab2c-206ff2594600"
migrations_dir = "migrations"
remote = false

[[env.staging.durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"

[[env.staging.migrations]]
tag = "v1_guest_inbox_infra"
new_sqlite_classes = ["GuestThreadCommandObject", "GuestInboxHubObject"]

[[env.staging.migrations]]
tag = "v2_delete_guest_thread_command"
deleted_classes = ["GuestThreadCommandObject"]

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "krabiclaw-media-staging"
remote = false

[[env.staging.kv_namespaces]]
binding = "ORGANIZATION_CACHE"
id = "9e829557fd2b46dba4148f2ed27a5c0b"
remote = false

[env.staging.ai]
binding = "AI"
remote = true

[env.staging.images]
binding = "IMAGES"

[env.staging.observability]
enabled = true

[env.staging.observability.traces]
enabled = true

# Built local Worker used by Playwright. It shares the local D1/KV identities
# prepared by e2e:local:prepare and has its own in-process Durable Object.
# Search remains production-only.
[env.e2e]

[env.e2e.triggers]
crons = []

[env.e2e.vars]
CF_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
BETTER_AUTH_URL = "http://localhost:3000"
NUXT_PUBLIC_PLATFORM_DOMAIN = "http://localhost:3000"
NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN = "http://localhost:3000"
NUXT_PUBLIC_APP_NAME = "Krabiclaw"
NUXT_PUBLIC_SITE_URL = "http://localhost:3000"
NUXT_PUBLIC_HELP_URL = "http://localhost:3000/help"
NUXT_PUBLIC_WHATSAPP_NUMBER = "16197200000"
MEDIA_BASE_URL = "http://localhost:3000/__media"
ZARAZ_ANALYTICS = "absent"
EMAIL_DELIVERY_MODE = "log_only"
WHATSAPP_DELIVERY_MODE = "log_only"

[[env.e2e.d1_databases]]
binding = "DB"
database_name = "krabiclaw-production-v16"
database_id = "754caf79-1e59-4e5e-93d7-18449df90e3b"
migrations_dir = "migrations"
remote = false

[[env.e2e.durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"

[[env.e2e.migrations]]
tag = "v1_guest_inbox_infra"
new_sqlite_classes = ["GuestThreadCommandObject", "GuestInboxHubObject"]

[[env.e2e.migrations]]
tag = "v2_delete_guest_thread_command"
deleted_classes = ["GuestThreadCommandObject"]

[[env.e2e.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "krabiclaw-media"
remote = false

[[env.e2e.kv_namespaces]]
binding = "ORGANIZATION_CACHE"
id = "7fadf142e35745d6bec16b260eaab2f2"
remote = false

[env.e2e.ai]
binding = "AI"
remote = true

[env.e2e.images]
binding = "IMAGES"
