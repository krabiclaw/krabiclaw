name = "blawby"
main = ".output/server/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat_v2", "nodejs_compat_populate_process_env", "global_fetch_strictly_public", "web_socket_auto_reply_to_close"]
# V8 keeps the Worker's source in the isolate's 128 MB heap, two bytes a
# character once any character is outside ASCII. Unminified, the 41M-character
# bundle held 78.5 MB of a 122 MB idle heap, so a few page renders pushed the
# isolate over its limit and killed whatever was still streaming (MCP listen
# streams). Minified it is 23.8M characters and the idle heap 78 MB.
minify = true

# D1 lives in WNAM and every statement is a round trip to it. Smart placement
# never moved execution (every request reported cf-placement local-*), so a
# visitor paid 8-27 trans-continental hops per page. Run next to the database.
[placement]
mode = "targeted"
region = "aws:us-west-2"

[assets]
directory = ".output/public"

[dev]
port = 3000
local_protocol = "http"
upstream_protocol = "http"

[triggers]
# Every expression is dispatched through Nitro's cloudflare:scheduled hook.
# Keep this list in sync with SCHEDULED_TASKS in server/scheduled-tasks.ts.
crons = ["0 0 * * SUN"]

[[routes]]
pattern = "*.krabiclaw.com/*"
zone_name = "krabiclaw.com"

[[routes]]
pattern = "krabiclaw.com/*"
zone_name = "krabiclaw.com"

[[routes]]
pattern = "*/*"
zone_name = "krabiclaw.com"

[[routes]]
pattern = "blawby.com/*"
zone_name = "blawby.com"

[[routes]]
pattern = "*.blawby.com/*"
zone_name = "blawby.com"

[[routes]]
pattern = "https://*/*"
zone_name = "blawby.com"

[[routes]]
pattern = "http://*/*"
zone_name = "blawby.com"

[vars]
STRIPE_BILLING_METER_MIGRATION = "true"
# Sign in with Apple audience: the native app's bundle id.
APPLE_APP_BUNDLE_ID = "com.krabiclaw.app"
APPLE_SERVICES_ID = "com.krabiclaw.web"
# Google Sign-In audience for the iPhone app: its iOS OAuth client (public, not a secret).
GOOGLE_IOS_CLIENT_ID = "799728932262-q966lhbncjn84gt85fgbscki6t9ruvpg.apps.googleusercontent.com"
# APNs token authentication (APNS_PRIVATE_KEY is a secret: yarn wrangler secret put APNS_PRIVATE_KEY).
APNS_KEY_ID = "M6MMSR6BM3"
APNS_TEAM_ID = "WDXU8XZ7J6"
APNS_BUNDLE_ID = "com.krabiclaw.app"
# Web push (VAPID). The public key is what browsers subscribe with; VAPID_PRIVATE_KEY is its secret.
NUXT_PUBLIC_VAPID_PUBLIC_KEY = "BG_WwHiB15TZy0I_b0OUKcTFNZk_7PS1gE2ljDNsC0xrLRltELxY8ZpbHtrPPF28CYu702QYvmutaHvbiy2sdCc"
CF_PLATFORM_ZONE_ID = "cdde6f2a8040e76dd081c08c18ad41dd"
CF_LEGACY_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
CF_SAAS_CNAME_TARGET = "customers.blawby.com"
BETTER_AUTH_URL = "https://blawby.com"
NUXT_PUBLIC_PLATFORM_DOMAIN = "https://blawby.com"
NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN = "https://blawby.com"
NUXT_PUBLIC_APP_NAME = "Blawby"
NUXT_PUBLIC_SITE_URL = "https://blawby.com"
NUXT_PUBLIC_HELP_URL = "https://blawby.com/help"
NUXT_PUBLIC_WHATSAPP_NUMBER = "16197200000"
MEDIA_BASE_URL = "https://media.blawby.com"
# Channex: production uses the Channex staging account (owner decision 2026-10-16) until
# Channex certification. CHANNEX_API_KEY and CHANNEX_WEBHOOK_SECRET are secrets.
CHANNEX_BASE_URL = "https://staging.channex.io/api/v1"
# Production is the only environment that should send real email/WhatsApp. Every environment
# states EMAIL_DELIVERY_MODE explicitly: a missing or invalid value fails email delivery
# (EMAIL_DELIVERY_MODE_REQUIRED / INVALID_EMAIL_DELIVERY_MODE), and WHATSAPP_DELIVERY_MODE
# likewise. EMAIL_FROM is the required sender; there is no default From address.
EMAIL_DELIVERY_MODE = "provider"
EMAIL_FROM = "Blawby <hello@blawby.com>"
EMAIL_REPLY_DOMAIN = "reply.blawby.com"
WHATSAPP_DELIVERY_MODE = "provider"
# Startup workflow debugging: detailed MCP inputs/results expire after seven days.
MCP_DIAGNOSTICS_ENABLED = "true"
# Internal cron/API endpoints use CRON_SECRET:
#   yarn wrangler secret put CRON_SECRET
# GA4_API_SECRET (Measurement Protocol) is a secret, not a var. It belongs to the
# GA4 property connected to the platform organization's own Google Analytics
# integration; there is no environment-level measurement ID:
#   yarn wrangler secret put GA4_API_SECRET
# PREVIEW_SECRET signs scoped preview/draft tokens (server/utils/preview-token.ts)
# and is required by the onboarding draft endpoints. It must stay stable across
# deploys/runs in a given environment — rotating it invalidates any draft preview
# tokens currently in flight. Staging and production set it once as a Worker
# secret; CI's E2E job gives its local Worker the PREVIEW_SECRET_PREVIEW repo
# secret (see .github/workflows/ci.yml):
#   yarn wrangler secret put PREVIEW_SECRET
# EMAIL_REPLY_SECRET signs r<g|m><entry><token>@reply.<platform-domain> addresses
# (server/utils/reply-address.ts) so an inbound reply can be matched back to the conversation
# entry its email was about.
# It must stay stable across deploys because rotating it invalidates reply-to addresses already
# sent out in guest emails. Staging syncs it from the fixed EMAIL_REPLY_SECRET_STAGING repo
# secret on every run (see .github/workflows/ci.yml); production is set once manually and not
# touched by CI:
#   yarn wrangler secret put EMAIL_REPLY_SECRET

[[d1_databases]]
binding = "DB"
database_name = "blawby-production-v29"
database_id = "ba04f645-2820-4813-83fa-4567850be3e1"
migrations_dir = "migrations"
remote = false

[[durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"

[[migrations]]
tag = "v1_guest_inbox_infra"
new_sqlite_classes = ["GuestThreadCommandObject", "GuestInboxHubObject"]

[[migrations]]
tag = "v2_delete_guest_thread_command"
deleted_classes = ["GuestThreadCommandObject"]

# What a write announces, delivered by Cloudflare to whatever reacts (server/events.ts). No timer looks for it.
[[queues.producers]]
binding = "EVENTS"
queue = "blawby-events"

[[queues.consumers]]
queue = "blawby-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "blawby-events-dlq"

# Airbnb sync and disconnect steps (server/integrations/channex/airbnb-sync.ts): one delivery at a time,
# so a repeated delivery reads the stage the earlier one saved and never sends the same Channex create twice.
[[queues.producers]]
binding = "AIRBNB_SYNC"
queue = "blawby-airbnb-sync"

[[queues.consumers]]
queue = "blawby-airbnb-sync"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
max_concurrency = 1
dead_letter_queue = "blawby-airbnb-sync-dlq"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "blawby-media"
remote = false

[[kv_namespaces]]
binding = "ORGANIZATION_CACHE"
id = "7fadf142e35745d6bec16b260eaab2f2"
remote = false

[ai]
binding = "AI"
remote = true

[images]
binding = "IMAGES"

[observability]
enabled = true

[observability.traces]
enabled = true

# Stable staging environment — uses dedicated non-production data/resources.
# Tenant aliases stay at the first subdomain level (for example,
# pottery-house-staging.blawby.com), which is covered by the zone certificate.
# The more-specific environment route wins over production's broad wildcard.
# `nuxt dev` only. Wrangler's platform proxy runs an empty script, so a Durable
# Object bound to a class in this Worker never resolves there; the class is
# served by server/cloudflare/dev/wrangler.toml (started by
# server/plugins/00.cloudflare-dev-bindings.ts) and bound by script_name.
# Bindings are not inherited by an environment, so the rest mirrors the
# top-level Worker against the same local resources. Never deployed.
[env.dev]

[env.dev.vars]
# Sign in with Apple audience: the native app's bundle id.
APPLE_APP_BUNDLE_ID = "com.krabiclaw.app"
APPLE_SERVICES_ID = "com.krabiclaw.web"
# Google Sign-In audience for the iPhone app: its iOS OAuth client (public, not a secret).
GOOGLE_IOS_CLIENT_ID = "799728932262-q966lhbncjn84gt85fgbscki6t9ruvpg.apps.googleusercontent.com"
# APNs token authentication (APNS_PRIVATE_KEY is a secret: yarn wrangler secret put APNS_PRIVATE_KEY).
APNS_KEY_ID = "M6MMSR6BM3"
APNS_TEAM_ID = "WDXU8XZ7J6"
APNS_BUNDLE_ID = "com.krabiclaw.app"
# Web push (VAPID). The public key is what browsers subscribe with; VAPID_PRIVATE_KEY is its secret.
NUXT_PUBLIC_VAPID_PUBLIC_KEY = "BMFc2bnPtTa7_yxaha67kLKr48zuVPW23LQDEX2cpdV7gfrkJYwscjxgA6Mjj8nMXDU5hgnEa8cLiVcIWUi75GE"
CF_SAAS_CNAME_TARGET = "customers.krabiclaw.com"
BETTER_AUTH_URL = "http://localhost:3000"
NUXT_PUBLIC_PLATFORM_DOMAIN = "http://localhost:3000"
NUXT_PUBLIC_FREE_ORGANIZATION_DOMAIN = "http://localhost:3000"
NUXT_PUBLIC_APP_NAME = "Blawby"
NUXT_PUBLIC_SITE_URL = "http://localhost:3000"
NUXT_PUBLIC_HELP_URL = "http://localhost:3000/help"
NUXT_PUBLIC_WHATSAPP_NUMBER = "16197200000"
MEDIA_BASE_URL = "http://localhost:3000/__media"
EMAIL_DELIVERY_MODE = "provider"
EMAIL_FROM = "Blawby <hello@blawby.com>"
EMAIL_REPLY_DOMAIN = "reply.blawby.local"
WHATSAPP_DELIVERY_MODE = "provider"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "blawby-production-v28"
database_id = "737276b7-41f7-4e05-8c6c-dc575b8d8e2a"
migrations_dir = "migrations"
remote = false

[[env.dev.durable_objects.bindings]]
name = "GUEST_INBOX_HUBS"
class_name = "GuestInboxHubObject"
script_name = "blawby-guest-inbox-hub"

# The platform proxy uses the dev registry to reach the queue consumer in the local inbox hub Worker.
[[env.dev.queues.producers]]
binding = "EVENTS"
queue = "blawby-events-local"

# Airbnb sync and disconnect steps (server/integrations/channex/airbnb-sync.ts): one delivery at a time,
# so a repeated delivery reads the stage the earlier one saved and never sends the same Channex create twice.
[[env.dev.queues.producers]]
binding = "AIRBNB_SYNC"
queue = "blawby-airbnb-sync-local"

[[env.dev.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "blawby-media"
remote = false

[[env.dev.kv_namespaces]]
binding = "ORGANIZATION_CACHE"
id = "7fadf142e35745d6bec16b260eaab2f2"
remote = false

[env.dev.ai]
binding = "AI"
remote = true

[env.dev.images]
binding = "IMAGES"

[env.staging]
name = "blawby-staging"
routes = [
  { pattern = "staging.blawby.com/*", zone_name = "blawby.com" },
  { pattern = "*-staging.blawby.com/*", zone_name = "blawby.com" },
  { pattern = "staging.krabiclaw.com/*", zone_name = "krabiclaw.com" },
  { pattern = "*-staging.krabiclaw.com/*", zone_name = "krabiclaw.com" }
]

# Staging runs where production runs, beside the database, so its timings predict production's.
[env.staging.placement]
mode = "targeted"
region = "aws:us-west-2"

# Top-level [triggers] crons are inherited by named environments unless
# overridden. Scheduled tasks never run against staging's copy of production
# data: scanning a growing, never-cleaned non-production database every few
# minutes once drove a 93B-row D1 billing spike.
[env.staging.triggers]
crons = []

[env.staging.vars]
STRIPE_BILLING_METER_MIGRATION = "true"
# Channex staging, where the Airbnb test accounts live. CHANNEX_API_KEY is a secret.
CHANNEX_BASE_URL = "https://staging.channex.io/api/v1"
# Sign in with Apple audience: the native app's bundle id.
